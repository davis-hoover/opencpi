# include:
#   - .gitlab-ci/yaml/docs.yml

stages:
  - framework
  - install
  - deploy
  - test
  - docs

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  GIT_SUBMODULE_UPDATE_FLAGS: --remote
  HOST:
    description:  "The host platform to install framework for."
    value: "rocky8"
    options:
      - "rocky8"
      - "ubuntu20_04"
  # RCC_PLATFORM:
  #   description: "The rcc platform to run pipeline for."
  # RCC_TOOL:
  #   description: "Vendor build tool to use in pipeline for rcc platform."
  #   value: none
  #   options:
  #     - none
  #     - vitis:2019.2-aarch32
  #     - vitis:2019.2-aarch64
  # HDL_PLATFORM:
  #   description: "The hdl platform to run pipeline for."
  # HDL_TARGET:
  #   description: "The hdl target to run pipeline for."
  # HDL_TOOL:
  #   description: "Vendor build tool to use in pipeline for hdl target and platform."
  #   value: none
  #   options:
  #     - none
  #     - vivado:2021.1
  #     - vivado:2019.2
  DO_HWIL:
    description: "Whether to do HWIL testing."
    value: "False"
  DO_SIM:
    description: "Whether to do simulator testing."
    value: "True"

workflow:
  auto_cancel:
      on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      variables:
        CACHE_KEY_SUFFIX: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    - when: always

.default:
  image: "${CI_OCPI_CONTAINER_REGISTRY}/builder:0.0.3"
  before_script: aws ecr get-login-password --region us-east-1 | podman login --username AWS
                 --password-stdin $CI_OCPI_CONTAINER_REGISTRY > /dev/null 2>&1
  artifacts:
    when: always
    expire_in: "7 days"
    paths:
      - .gitlab-ci/artiacts/job-report.xml
    reports:
      junit: .gitlab-ci/artifacts/job-report.xml

.merge_request:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

.web:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

.schedule:
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: always
  - when: never  

.rcc_platform:
  extends: .default
  stage: install
  tags: ['aws', 'opencpi', 'cache', 'platform']
  allow_failure: true
  script: cd .gitlab-ci && make rcc_platform

.hdl_target:
  extends: .default
  stage: install
  tags: ['aws', 'opencpi', 'cache', 'platform']
  allow_failure: true
  script: cd .gitlab-ci && make hdl_target

.hdl_platform:
  extends: .default
  stage: install
  tags: ['aws', 'opencpi', 'cache', 'platform']
  allow_failure: true
  script: cd .gitlab-ci && make hdl_platform

framework:
  extends: .default
  stage: framework
  tags: ['aws', 'opencpi', 'cache', 'platform']
  script: cd .gitlab-ci && make framework

rcc_platform:
  extends:
    - .rcc_platform
    - .web

hdl_target:
  extends:
    - .hdl_target
    - .web

hdl_platform:
  extends:
    - .hdl_platform
    - .web
  needs:
    - job: hdl_target
      artifacts: false

rcc_platforms:
  extends: 
    - .rcc_platform
    - .merge_request
  parallel:
    matrix:
      - RCC_PLATFORM: xilinx19_2_aarch32
        RCC_TOOL: vitis:2019.2-aarch32
      - RCC_PLATFORM: xilinx19_2_aarch64
        RCC_TOOL: vitis:2019.2-aarch64

hdl_targets:
  extends: 
    - .hdl_target
    - .merge_request
  parallel:
    matrix:
      - HDL_TARGET:
        - zynq
        - zynq_ultra
        - xsim

hdl_platforms:
  extends: 
    - .hdl_platform
    - .merge_request
  needs:
    - job: hdl_targets
      artifacts: false
  parallel:
    matrix:
      - HDL_PLATFORM:
        - zed
        HDL_TARGET: zynq
      - HDL_PLATFORM:
        - zcu_104
        HDL_TARGET: zynq_ultra
      - HDL_PLATFORM: xsim
        HDL_TARGET: xsim
  
