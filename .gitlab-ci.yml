include:
  - local: .gitlab-ci/yaml/include.yml
  - local: .gitlab-ci/yaml/docs.yml
  - local: .gitlab-ci/yaml/default.yml
    rules:
      - if: $CI_PIPELINE_SOURCE !~ /^(web|schedule|pipeline)$/
  - local: .gitlab-ci/yaml/schedule.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "schedule"
  - local: .gitlab-ci/yaml/web.yml
    rules: # Convoluted to get around gitlab issue showing variables in web UI if include rule contains "=="
      - if: $CI_PIPELINE_SOURCE !~ /^(schedule|push|merge_request_event|pipeline)$/
  - project: ${UPSTREAM_NAMESPACE}/${UPSTREAM_PROJECT}
    ref: ${UPSTREAM_REF}
    file: .gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "pipeline"
