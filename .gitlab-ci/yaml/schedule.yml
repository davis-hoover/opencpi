rcc_platforms:
  extends: .rcc_platform
  parallel:
    matrix:
      - RCC_PLATFORM: 
          - xilinx19_2_aarch32
          - xilinx19_2_aarch64
          - adi_plutosdr0_32

hdl_targets:
  extends: .hdl_target
  parallel:
    matrix:
      - HDL_TARGET:
        - zynq
        - zynq_ultra
        - xsim
        - artix7

hdl_platforms:
  extends: .hdl_platform
  parallel:
    matrix:
      - HDL_PLATFORM: [zed, e31x, plutosdr, zed_ether]
        HDL_TARGET: zynq
      - HDL_PLATFORM: zcu104
        HDL_TARGET: zynq_ultra
      - HDL_PLATFORM: picoevb
        HDL_TARGET: artix7
      - HDL_PLATFORM: xsim
        HDL_TARGET: xsim

hdl_rcc_platforms:
  extends: .hdl_rcc_platform
  parallel:
    matrix:
      - HDL_PLATFORM: [zed, e31x]
        RCC_PLATFORM: xilinx19_2_aarch32
      - HDL_PLATFORM: zcu104
        RCC_PLATFORM: xilinx19_2_aarch64
      - HDL_PLATFORM: plutosdr
        RCC_PLATFORM: adi_plutosdr0_32

test:
  extends: .test
  parallel:
    matrix:
      - MODEL: 'hdl'
        HDL_PLATFORM: xsim
      - MODEL: ['hdl', 'rcc']
        HDL_PLATFORM: zed
        RCC_PLATFORM: xilinx19_2_aarch32
      - MODEL: ['hdl', 'rcc']
        HDL_PLATFORM: zcu104
        RCC_PLATFORM: xilinx19_2_aarch64
